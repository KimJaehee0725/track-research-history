services:
  research-memory-ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: research-memory-ui:local
    restart: unless-stopped
    environment:
      MEMORY_DATA_DIR: /srv/research-memory
      # Docker port forwarding requires an in-container non-loopback bind.
      # The only host listener remains 127.0.0.1:8787 below.
      MEMORY_BIND_HOST: 0.0.0.0
      MEMORY_BIND_PORT: "8787"
    command:
      - python
      - -m
      - uvicorn
      - server.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Set MEMORY_HOST_DATA_DIR only to a deliberate, absolute host path.
      # Defaulting to /srv/research-memory makes the persistent source clear.
      - "${MEMORY_HOST_DATA_DIR:-/srv/research-memory}:/srv/research-memory"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
