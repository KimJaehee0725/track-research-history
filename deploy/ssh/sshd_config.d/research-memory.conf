# Install as /etc/ssh/sshd_config.d/research-memory.conf and validate with:
#   sudo sshd -t
#
# Use the dedicated `memory-rpc` Unix account exclusively for memctl/RPC keys.
# Every key in that account's authorized_keys MUST have the fixed `command=`
# option shown in authorized_keys.example.  The command ignores
# SSH_ORIGINAL_COMMAND and reads only JSON lines on stdin.

Match User memory-rpc
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    PermitUserRC no
    PermitTunnel no
    PermitOpen none
    MaxSessions 2
