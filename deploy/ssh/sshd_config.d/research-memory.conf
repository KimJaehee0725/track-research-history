# Install as /etc/ssh/sshd_config.d/research-memory.conf and validate with:
#   sudo sshd -t
#
# Personal password mode for the dedicated `memory-rpc` account. This account
# never starts a shell: sshd always runs the fixed JSON-lines RPC endpoint and
# the endpoint ignores SSH_ORIGINAL_COMMAND. Password authentication receives
# write access to every project on this personal server.
#
# This replaces the former project-scoped public-key configuration. Do not
# install it alongside another Match User memory-rpc fragment.

Match User memory-rpc
    AuthenticationMethods password
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
    PubkeyAuthentication no
    ForceCommand /opt/research-memory/.venv/bin/python /opt/research-memory/server/rpc.py --data-dir /srv/research-memory --allow-all-projects --permission write --actor personal-password
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    PermitUserRC no
    PermitTunnel no
    PermitOpen none
    MaxSessions 2
